        run: |
          [IO.File]::WriteAllBytes("release-413.patch", [Convert]::FromBase64String(($env:RELEASE_PATCH -replace "\s", "")))
          git apply --index release-413.patch
          Remove-Item release-413.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release NanoTwitchLeafs 4.1.3"
          git push origin HEAD:main

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate
        shell: pwsh
        run: |
          python tools/validate_ui_localization.py
          Get-ChildItem tools/validate_p*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Validate 4.1.3 fixes
        shell: pwsh
        run: |
          if (-not (Select-String -Path Properties/AssemblyInfo.cs -SimpleMatch 'AssemblyInformationalVersion("4.1.3")')) { exit 1 }
          if (-not (Select-String -Path Windows/MainWindow.xaml.cs -SimpleMatch '_chatConnectionInProgress')) { exit 1 }
          if (-not (Select-String -Path Windows/TriggerDetailWindow.xaml.cs -SimpleMatch 'UpdateEffectControls')) { exit 1 }

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet restore NanoTwitchLeafs.Modern.csproj
          dotnet publish NanoTwitchLeafs.Modern.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/NanoTwitchLeafs-4.1.3-win-x64
          Remove-Item "artifacts/NanoTwitchLeafs-4.1.3-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.1.3-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.1.3-win-x64.zip"

      - name: Create public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          ## Deutsch

          - Falsche Hinweise auf ungespeicherte Änderungen während der Twitch-Serververbindung behoben.
          - Automatisch aktualisierte Nanoleaf-Verbindungsdaten werden nicht mehr als Benutzereingaben gewertet.
          - Effekt- und Farbauswahl für normale Trigger wird nach einem Wechsel von „Benutzerfarbe“ wieder korrekt aktiviert.
          - Effektauswahl für Follower, Spenden, Bits, Abonnements und weitere Trigger wiederhergestellt.

          ## English

          - Fixed false unsaved-change warnings during Twitch server connection.
          - Automatically refreshed Nanoleaf connection data is no longer treated as user input.
          - Effect and color selection for regular triggers is correctly restored after switching from Username Color.
          - Restored effect selection for followers, donations, bits, subscriptions, and other triggers.
          "@ | Set-Content release-notes.md -Encoding UTF8
          gh release create v4.1.3 "artifacts/NanoTwitchLeafs-4.1.3-win-x64.zip" --repo "${{ github.repository }}" --title "NanoTwitchLeafs 4.1.3" --notes-file release-notes.md --latest

