name: Complete P14 translations

on:
  push:
    branches: [preview/modern-layout]
    paths:
      - .github/workflows/translate-p14.yml
      - tools/complete_p14_translations.py

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/modern-layout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install deep-translator==1.11.4
      - run: python tools/complete_p14_translations.py
      - name: Commit completed resources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Properties/Resources.*.resx
          git commit -m "Complete P14 language resources"
          git push origin HEAD:preview/modern-layout
