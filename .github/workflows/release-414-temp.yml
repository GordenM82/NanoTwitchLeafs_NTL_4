name: Release NanoTwitchLeafs 4.1.4 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate release
        shell: pwsh
        run: |
          python tools/validate_ui_localization.py
          python tools/validate_p22.py
          python tools/validate_p23.py
          python tools/validate_p24.py
          python tools/validate_p25.py
          python tools/validate_p26.py
          python tools/validate_p27.py
          python tools/validate_p28.py
          python tools/validate_p29.py
          python tools/validate_p30.py
          python tools/validate_release_414.py

      - name: Publish Windows x64
        run: dotnet publish NanoTwitchLeafs.Modern.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/NanoTwitchLeafs-4.1.4-win-x64

      - name: Create ZIP
        shell: pwsh
        run: |
          Remove-Item "artifacts/NanoTwitchLeafs-4.1.4-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.1.4-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.1.4-win-x64.zip"

      - name: Publish 4.1.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag v4.1.4
          git push origin v4.1.4
          gh release create v4.1.4 "artifacts/NanoTwitchLeafs-4.1.4-win-x64.zip" --title "NanoTwitchLeafs 4.1.4" --latest --notes-file CHANGELOG.md
