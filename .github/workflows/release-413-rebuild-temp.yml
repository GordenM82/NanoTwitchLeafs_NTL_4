name: Rebuild NanoTwitchLeafs 4.1.3 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply confirmed 4.1.3 fixes
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\fix-413.patch", [Convert]::FromBase64String(""))
          git apply --check "$env:RUNNER_TEMP\fix-413.patch"
          git apply "$env:RUNNER_TEMP\fix-413.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Controller/NanoController.cs Windows/MainWindow.xaml.cs Windows/TriggerDetailWindow.xaml.cs Windows/TriggerWindow.xaml.cs
          git commit -m "Fix 4.1.3 startup state and effect loading"
          git push origin HEAD:main

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate regressions
        shell: pwsh
        run: |
          python tools/validate_ui_localization.py
          python tools/validate_p25.py
          python tools/validate_p28.py
          python tools/validate_release_413.py

      - name: Publish Windows x64
        run: dotnet publish NanoTwitchLeafs.Modern.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/NanoTwitchLeafs-4.1.3-win-x64

      - name: Create release ZIP
        shell: pwsh
        run: |
          Remove-Item "artifacts/NanoTwitchLeafs-4.1.3-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.1.3-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.1.3-win-x64.zip"

      - name: Replace public 4.1.3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v4.1.3 --yes --cleanup-tag
          git tag -f v4.1.3
          git push origin v4.1.3 --force
          gh release create v4.1.3 "artifacts/NanoTwitchLeafs-4.1.3-win-x64.zip" --title "NanoTwitchLeafs 4.1.3" --latest --notes-file CHANGELOG.md
