name: Publish NanoTwitchLeafs 4.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NanoTwitchLeafs.Modern.csproj

      - name: Publish Windows x64
        run: >-
          dotnet publish NanoTwitchLeafs.Modern.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/NanoTwitchLeafs-4.0.0-win-x64

      - name: Create release ZIP
        shell: pwsh
        run: |
          Remove-Item "artifacts/NanoTwitchLeafs-4.0.0-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.0.0-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.0.0-win-x64.zip"

      - name: Write bilingual release notes
        shell: pwsh
        run: |
          @'
          ## Deutsch

          NanoTwitchLeafs 4.0.0 ist die erste öffentliche Version der modernisierten Anwendung.

          - Twitch-Anmeldung ohne eigene Client-ID und ohne Client-Secret
          - Unterstützung mehrerer Nanoleaf-Geräte und Gerätegruppen
          - Twitch EventSub einschließlich HypeTrain v2
          - direkter Import von Einstellungen und Triggern aus NanoTwitchLeafs 3.x
          - selbstständiges Windows-x64-Paket für Windows 10 und Windows 11

          Das Projekt bleibt experimentell. Vor wichtigen Änderungen sollte `%APPDATA%\NanoTwitchLeafs-4` gesichert werden.

          ## English

          NanoTwitchLeafs 4.0.0 is the first public release of the modernized application.

          - Twitch sign-in without a personal client ID or client secret
          - support for multiple Nanoleaf devices and device groups
          - Twitch EventSub including HypeTrain v2
          - direct import of settings and triggers from NanoTwitchLeafs 3.x
          - self-contained Windows x64 package for Windows 10 and Windows 11

          The project remains experimental. Back up `%APPDATA%\NanoTwitchLeafs-4` before important changes.
          '@ | Set-Content release-notes.md

      - name: Create stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v4.0.0
          "artifacts/NanoTwitchLeafs-4.0.0-win-x64.zip"
          --title "NanoTwitchLeafs 4.0.0"
          --notes-file release-notes.md
          --target "${{ github.sha }}"