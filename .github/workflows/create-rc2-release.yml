name: Create NanoTwitchLeafs 4.0.0 RC2 pre-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-rc2-release.yml"

permissions:
  contents: write

jobs:
  create-rc2:
    runs-on: windows-latest
    steps:
      - name: Checkout tested main
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet restore NanoTwitchLeafs.Modern.csproj
          dotnet publish NanoTwitchLeafs.Modern.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/NanoTwitchLeafs-4.0.0-win-x64
          Remove-Item "artifacts/NanoTwitchLeafs-4.0.0-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.0.0-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.0.0-win-x64.zip"

      - name: Create exact RC2 pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v4.0.0-rc.2" "artifacts/NanoTwitchLeafs-4.0.0-win-x64.zip" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "NanoTwitchLeafs 4.0.0 – Release Candidate 2" --prerelease --generate-notes
