name: Release NanoTwitchLeafs 4.1.6 (temporary)

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-416-temp.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate release
        run: |
          python tools/validate_ui_localization.py
          python tools/validate_p22.py
          python tools/validate_p23.py
          python tools/validate_p24.py
          python tools/validate_p25.py
          python tools/validate_p26.py
          python tools/validate_p27.py
          python tools/validate_p28.py
          python tools/validate_p29.py
          python tools/validate_p30.py
          python tools/validate_release_416.py
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet restore NanoTwitchLeafs.Modern.csproj
          dotnet publish NanoTwitchLeafs.Modern.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/NanoTwitchLeafs-4.1.6-win-x64
          Remove-Item "artifacts/NanoTwitchLeafs-4.1.6-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.1.6-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.1.6-win-x64.zip"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4.1.6 "artifacts/NanoTwitchLeafs-4.1.6-win-x64.zip" --repo "${{ github.repository }}" --target main --title "NanoTwitchLeafs 4.1.6" --notes "Automatic restart after language changes, clearer manual update checks, reliable sanitized support logs, and improved multi-line console copying."
