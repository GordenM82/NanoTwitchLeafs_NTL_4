name: Publish NanoTwitchLeafs 4.0.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NanoTwitchLeafs.Modern.csproj

      - name: Publish Windows x64
        run: >-
          dotnet publish NanoTwitchLeafs.Modern.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/NanoTwitchLeafs-4.0.1-win-x64

      - name: Create release ZIP
        shell: pwsh
        run: |
          Remove-Item "artifacts/NanoTwitchLeafs-4.0.1-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.0.1-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.0.1-win-x64.zip"

      - name: Write bilingual release notes
        shell: pwsh
        run: |
          @'
          ## Deutsch

          Bugfix-Release für das Informationsfenster:

          - Abstürze beim Öffnen von Discord-, GitHub- und Feedback-Links behoben
          - getrennte GitHub- und Feedback-Links für Originalversion und NTL 4
          - ursprünglicher Entwickler und NTL-4-Weiterentwicklung getrennt ausgewiesen
          - KI- und Unabhängigkeitshinweise ergänzt

          ## English

          Bug-fix release for the information window:

          - fixed crashes when opening Discord, GitHub, and feedback links
          - separate GitHub and feedback links for the original version and NTL 4
          - distinguished the original developer from NTL 4 development
          - added AI-assistance and non-affiliation notices
          '@ | Set-Content release-notes.md

      - name: Create stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v4.0.1
          "artifacts/NanoTwitchLeafs-4.0.1-win-x64.zip"
          --title "NanoTwitchLeafs 4.0.1"
          --notes-file release-notes.md
          --target "${{ github.sha }}"