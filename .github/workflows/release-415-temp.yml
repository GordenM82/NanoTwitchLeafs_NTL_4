name: Release NanoTwitchLeafs 4.1.5 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply verified 4.1.5 source
        run: |
          tar -xzf ntl415-update.tar.gz
          git checkout -- .github/workflows/build-release.yml
          rm -f ntl415-update.tar.gz tools/validate_release_414.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release NanoTwitchLeafs 4.1.5"
          git push origin HEAD:main

  build-and-release:
    needs: prepare-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate release
        shell: pwsh
        run: |
          (Get-Content .github/workflows/build-release.yml -Raw).Replace('4.1.4', '4.1.5') | Set-Content .github/workflows/build-release.yml
          python tools/validate_ui_localization.py
          python tools/validate_p22.py
          python tools/validate_p23.py
          python tools/validate_p24.py
          python tools/validate_p25.py
          python tools/validate_p26.py
          python tools/validate_p27.py
          python tools/validate_p28.py
          python tools/validate_p29.py
          python tools/validate_p30.py
          python tools/validate_release_415.py
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet restore NanoTwitchLeafs.Modern.csproj
          dotnet publish NanoTwitchLeafs.Modern.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/NanoTwitchLeafs-4.1.5-win-x64
          Remove-Item "artifacts/NanoTwitchLeafs-4.1.5-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.1.5-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.1.5-win-x64.zip"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4.1.5 "artifacts/NanoTwitchLeafs-4.1.5-win-x64.zip" --repo "${{ github.repository }}" --target main --title "NanoTwitchLeafs 4.1.5" --notes "Dual-source update checks for GordenM82/NTL 4 and Locxion/Original, selectable update source, explicit branch-switch warning, and ZIP updates directly into the existing application folder."

