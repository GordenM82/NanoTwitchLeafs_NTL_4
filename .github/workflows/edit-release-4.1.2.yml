name: Clean NanoTwitchLeafs 4.1.2 release notes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  edit-release-notes:
    if: github.head_ref == 'cleanup/trigger-release-notes-4.1.2'
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.2
          name: NanoTwitchLeafs 4.1.2
          prerelease: false
          generate_release_notes: false
          body: |
            Kleines Korrekturupdate für Twitch-Kontostatus und Speicheranzeige:

            - neutrale Twitch-Kontobezeichnung beim Einzelkonto
            - Bot-Konto-Bezeichnung nur beim Doppel-Konto
            - keine falsche Meldung über ungespeicherte Änderungen nach automatischer Tokenspeicherung

            Small corrective update for Twitch account status and save indication:

            - neutral Twitch-account wording for single-account setups
            - bot-account wording only for dual-account setups
            - no false unsaved-change warning after automatic token persistence
