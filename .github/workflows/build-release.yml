name: Build NanoTwitchLeafs 4

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "preview/**"]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NanoTwitchLeafs.Modern.csproj

      - name: Publish Windows x64
        run: >-
          dotnet publish NanoTwitchLeafs.Modern.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/NanoTwitchLeafs-4.1.0-layout-preview.2-win-x64

      - name: Remove development-only files
        shell: pwsh
        run: |
          Remove-Item "artifacts/NanoTwitchLeafs-4.1.0-layout-preview.2-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.1.0-layout-preview.2-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.1.0-layout-preview.2-win-x64.zip"

      - name: Upload release ZIP
        uses: actions/upload-artifact@v6
        with:
          name: NanoTwitchLeafs-4.1.0-layout-preview.2-win-x64
          path: artifacts/NanoTwitchLeafs-4.1.0-layout-preview.2-win-x64.zip
          if-no-files-found: error
