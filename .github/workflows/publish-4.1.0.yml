# One-time stable release workflow; removed after publication.
name: Publish NanoTwitchLeafs 4.1.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate release
        shell: pwsh
        run: |
          python tools/validate_ui_localization.py
          22..30 | ForEach-Object { python "tools/validate_p$_.py"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_release_410.py

      - name: Restore
        run: dotnet restore NanoTwitchLeafs.Modern.csproj

      - name: Publish Windows x64
        run: >-
          dotnet publish NanoTwitchLeafs.Modern.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/NanoTwitchLeafs-4.1.0-win-x64

      - name: Create release ZIP
        shell: pwsh
        run: |
          Remove-Item "artifacts/NanoTwitchLeafs-4.1.0-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.1.0-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.1.0-win-x64.zip"

      - name: Write bilingual release notes
        shell: pwsh
        run: |
          @'
          ## Deutsch

          NanoTwitchLeafs 4.1.0 veröffentlicht die vollständig überarbeitete und geprüfte neue Oberfläche.

          - zentrale Navigation und Verwaltung im Hauptfenster
          - Hell-, Dunkel- und Systemdesign
          - StreamElements-Tips mit lokalem Testereignis
          - Twitch-Blocklist im Hauptfenster
          - Trigger-Suche, Filter, Warnungen und Tooltips
          - erweiterte Konsole mit bereinigtem Support-Protokoll
          - Fensterwiederherstellung, Mehrmonitorbetrieb und 100/125/150-%-Skalierung
          - zahlreiche Stabilitäts-, Übersetzungs- und Bedienungskorrekturen

          Bestehende 4.x-Daten unter `%APPDATA%\NanoTwitchLeafs-4` werden weiterverwendet. Vor wichtigen Updates wird eine Sicherung dieses Ordners empfohlen.

          ## English

          NanoTwitchLeafs 4.1.0 releases the fully redesigned and tested new interface.

          - central navigation and management inside the main window
          - Light, Dark, and System themes
          - StreamElements tips with a local test event
          - Twitch blocklist inside the main window
          - trigger search, filters, warnings, and tooltips
          - expanded console with a sanitized support log
          - restored window placement, multi-monitor operation, and 100/125/150% scaling
          - numerous stability, localization, and usability fixes

          Existing 4.x data under `%APPDATA%\NanoTwitchLeafs-4` is reused. Backing up this folder before important updates is recommended.
          '@ | Set-Content release-notes.md

      - name: Create stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v4.1.0
          "artifacts/NanoTwitchLeafs-4.1.0-win-x64.zip"
          --title "NanoTwitchLeafs 4.1.0"
          --notes-file release-notes.md
          --target main
