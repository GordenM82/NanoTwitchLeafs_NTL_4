name: Publish NanoTwitchLeafs 4.1.2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-windows-x64:
    if: github.head_ref == 'publish/trigger-4.1.2'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate release
        run: |
          python tools/validate_ui_localization.py
          python tools/validate_release_412.py

      - name: Publish Windows x64
        run: >-
          dotnet publish NanoTwitchLeafs.Modern.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/NanoTwitchLeafs-4.1.2-win-x64

      - name: Create release ZIP
        shell: pwsh
        run: |
          Remove-Item "artifacts/NanoTwitchLeafs-4.1.2-win-x64/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifacts/NanoTwitchLeafs-4.1.2-win-x64/*" -DestinationPath "artifacts/NanoTwitchLeafs-4.1.2-win-x64.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.2
          target_commitish: main
          name: NanoTwitchLeafs 4.1.2
          prerelease: false
          generate_release_notes: false
          body: |
            Kleines Korrekturupdate für Twitch-Kontostatus und Speicheranzeige:

            - neutrale Twitch-Kontobezeichnung beim Einzelkonto
            - Bot-Konto-Bezeichnung nur beim Doppel-Konto
            - keine falsche Meldung über ungespeicherte Änderungen nach automatischer Tokenspeicherung
            - bereinigte GitHub-Sprachstatistik bei weiterhin aktiven Prüfwerkzeugen

            Small corrective update for Twitch account status and save indication:

            - neutral Twitch-account wording for single-account setups
            - bot-account wording only for dual-account setups
            - no false unsaved-change warning after automatic token persistence
            - cleaned GitHub language statistics while keeping validation helpers active
          files: artifacts/NanoTwitchLeafs-4.1.2-win-x64.zip
